<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>APM-HSPC · Tracker</title>
<style>
  :root{
    --bg1:#070b12;
    --bg2:#0e1620;
    --bg3:#16212e;
    --glass:rgba(255,255,255,0.055);
    --glass-strong:rgba(255,255,255,0.1);
    --glass-border:rgba(255,255,255,0.14);
    --line:rgba(255,255,255,0.12);
    --text:#eaf5ff;
    --text-dim:#7f96ac;
    --accent:#00c8ff;
    --accent2:#00e6b8;
    --shadow:0 10px 30px rgba(0,0,0,0.55), 0 0 24px rgba(0,180,255,0.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; color:var(--text); min-height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  body{
    padding-bottom:44px;
    background:
      radial-gradient(ellipse 60% 40% at 15% 8%, rgba(0,200,255,0.10), transparent 60%),
      radial-gradient(ellipse 50% 35% at 90% 15%, rgba(0,230,180,0.08), transparent 60%),
      linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 50%, var(--bg3) 100%);
    background-attachment:fixed;
    position:relative;
    overflow-x:hidden;
  }
  /* bagliori sfocati sullo sfondo, versione "dark aero" anni 2000 (Xbox 360 / Zune / Vista dark) */
  body::before, body::after{
    content:""; position:fixed; border-radius:50%; filter:blur(40px);
    pointer-events:none; z-index:0;
  }
  body::before{
    width:280px; height:280px; top:-70px; right:-80px;
    background:radial-gradient(circle at 35% 30%, rgba(0,200,255,0.35), rgba(0,120,220,0.12) 60%, transparent 75%);
  }
  body::after{
    width:240px; height:240px; bottom:60px; left:-70px;
    background:radial-gradient(circle at 35% 30%, rgba(0,230,180,0.28), rgba(0,150,140,0.1) 60%, transparent 75%);
  }

  header{
    position:sticky; top:0; z-index:10;
    padding:18px 16px 0 16px;
    background:linear-gradient(180deg, rgba(10,14,20,0.85), rgba(10,14,20,0.4) 80%, transparent);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .headrow{
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
  }
  header h1{
    font-size:14px; letter-spacing:0.5px; margin:0 0 2px 0;
    color:var(--text-dim); font-weight:700;
  }
  header .sub{
    font-size:23px; font-weight:800; margin:0 0 14px 0; color:var(--text);
  }
  header .sub b{
    background:linear-gradient(180deg, #4fe0ff, #0091ff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  main{padding:16px; position:relative; z-index:1;}

  .day-title{
    font-size:13px; text-transform:uppercase; letter-spacing:0.8px;
    color:var(--text-dim); margin:4px 0 14px 0; font-weight:700;
  }

  /* pannello di vetro scuro: sfondo semitrasparente su nero, sfocatura, riflesso lucido sottile in alto */
  .card{
    position:relative; overflow:hidden;
    background:var(--glass);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--glass-border);
    border-radius:20px;
    padding:16px 16px 14px 16px; margin-bottom:14px;
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .card::before{
    content:""; position:absolute; top:0; left:0; right:0; height:46%;
    background:linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0));
    pointer-events:none; border-radius:20px 20px 50% 50% / 20px 20px 30px 30px;
  }
  .card .top{
    display:flex; justify-content:space-between; align-items:flex-start;
    margin-bottom:12px; gap:10px; position:relative; z-index:1;
  }
  .card .name{
    font-size:15.5px; font-weight:700; line-height:1.3; color:var(--text);
  }
  .card .target{
    font-size:12px; color:var(--accent); white-space:nowrap; font-weight:700;
    background:rgba(0,200,255,0.12); padding:3px 10px; border-radius:8px;
    margin-top:1px; border:1px solid rgba(0,200,255,0.3);
  }

  .setgrid{
    display:grid;
    grid-template-columns: 30px 1fr 1fr;
    gap:8px 8px;
    align-items:center;
    position:relative; z-index:1;
  }
  .setgrid .colhead{
    font-size:10px; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--text-dim); font-weight:700; padding-bottom:2px;
  }
  .setgrid .serie-num{
    font-size:12.5px; color:var(--accent); font-weight:800; text-align:center;
  }
  .setgrid .row{position:relative;}
  .setgrid input{
    width:100%; background:rgba(255,255,255,0.06); border:1px solid var(--glass-border);
    color:var(--text); font-size:16px; font-weight:700; padding:9px 9px;
    border-radius:10px; -moz-appearance:textfield;
    box-shadow:inset 0 1px 4px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .setgrid input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,200,255,0.25), inset 0 1px 4px rgba(0,0,0,0.4);}
  .setgrid .unit{
    position:absolute; right:9px; top:50%; transform:translateY(-50%);
    font-size:11px; color:var(--text-dim); pointer-events:none;
  }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }

  .cardio{
    font-size:12.5px; color:var(--text-dim); padding:10px 4px 4px 4px;
    border-top:1px dashed var(--line); margin-top:6px; margin-bottom:16px;
  }
  .cardio b{color:var(--text);}

  /* pulsante glossy dark-aero: gradiente ciano/blu acceso su base scura + riflesso lucido sopra */
  .save-session-btn{
    position:relative; overflow:hidden;
    width:100%; border:1px solid rgba(0,200,255,0.4); color:#fff;
    background:linear-gradient(180deg, #4fe0ff 0%, #0091ff 50%, #0062c4 100%);
    padding:15px; border-radius:14px; font-size:15px; font-weight:800;
    cursor:pointer; margin-bottom:8px;
    text-shadow:0 1px 2px rgba(0,20,40,0.5);
    box-shadow:0 6px 20px rgba(0,150,255,0.4), inset 0 1px 0 rgba(255,255,255,0.35);
  }
  .save-session-btn::before{
    content:""; position:absolute; top:0; left:0; right:0; height:50%;
    background:linear-gradient(180deg, rgba(255,255,255,0.3), rgba(255,255,255,0));
    border-radius:14px 14px 50% 50% / 14px 14px 20px 20px;
  }
  .save-session-btn:active{opacity:0.88; transform:translateY(1px);}

  .session-meta{
    text-align:center; font-size:11.5px; color:var(--text-dim); margin-bottom:6px;
  }

  .ex-select{
    width:100%; background:rgba(255,255,255,0.06); border:1px solid var(--glass-border);
    color:var(--text); font-size:14.5px; font-weight:700; padding:12px 10px;
    border-radius:12px; -webkit-appearance:none; appearance:none;
    box-shadow:inset 0 1px 4px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.05);
  }

  .stat-row{ display:flex; gap:8px; margin-bottom:6px; position:relative; z-index:1; }
  .stat-box{
    flex:1; background:rgba(255,255,255,0.05); border:1px solid var(--glass-border);
    border-radius:12px; padding:10px 6px; text-align:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .stat-box .stat-num{ font-size:16px; font-weight:800; color:var(--accent); text-shadow:0 0 10px rgba(0,200,255,0.45); }
  .stat-box .stat-lbl{ font-size:9.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.3px; margin-top:2px; }

  .empty-chart{
    font-size:12.5px; color:var(--text-dim); text-align:center; padding:20px 10px; line-height:1.5;
    position:relative; z-index:1;
  }

  .body-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:10px 10px;
    margin-bottom:4px; position:relative; z-index:1;
  }
  .body-field label{
    display:block; font-size:10px; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--text-dim); font-weight:700; margin-bottom:5px;
  }
  .body-field .row{ position:relative; }
  .body-field input{
    width:100%; background:rgba(255,255,255,0.06); border:1px solid var(--glass-border);
    color:var(--text); font-size:15px; font-weight:700; padding:9px 9px;
    border-radius:10px; -moz-appearance:textfield;
    box-shadow:inset 0 1px 4px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .body-field input:focus{
    outline:none; border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(0,200,255,0.25), inset 0 1px 4px rgba(0,0,0,0.4);
  }
  .body-field .unit{
    position:absolute; right:9px; top:50%; transform:translateY(-50%);
    font-size:10.5px; color:var(--text-dim); pointer-events:none;
  }

  .back-link{
    background:none; border:none; color:var(--accent); font-size:13.5px; font-weight:800;
    padding:4px 0 16px 0; cursor:pointer; display:block; font-family:inherit;
  }

  .top-action-row{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:2px;
  }
  .top-action-row .back-link{ padding:4px 0; }
  .danger-link{
    background:none; border:none; color:#ff6b7a; font-size:13px; font-weight:700;
    padding:4px 0; cursor:pointer; font-family:inherit;
  }

  .home-secondary-row{
    display:flex; gap:10px; margin-top:10px;
  }
  .secondary-nav-btn{
    flex:1; background:rgba(255,255,255,0.06); border:1px solid var(--glass-border);
    color:var(--text); font-size:13px; font-weight:700; padding:12px 8px;
    border-radius:14px; cursor:pointer; font-family:inherit;
  }
  .secondary-nav-btn:active{ background:rgba(255,255,255,0.12); }

  .home-greeting{
    font-size:23px; font-weight:800; color:var(--text); margin-bottom:2px;
    position:relative; z-index:1;
  }
  .home-date{
    font-size:19px; color:var(--text); font-weight:800;
    position:relative; z-index:1;
  }

  /* Pulsanti di selezione delle prime due schermate (Home + scelta sessione): più tondi/pill */
  .home-start-btn{
    border-radius:999px !important;
  }
  .home-start-btn::before{
    border-radius:999px !important;
  }

  .day-picker-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:12px; position:relative; z-index:1;
  }
  .day-picker-card{
    position:relative; overflow:hidden; cursor:pointer; text-align:left;
    font-family:inherit; -webkit-tap-highlight-color:transparent;
    background:linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0.03));
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--glass-border); border-radius:30px; padding:18px 16px;
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .day-picker-card::before{
    content:""; position:absolute; top:0; left:0; right:0; height:50%;
    background:linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0));
    pointer-events:none;
  }
  .day-picker-card:active{ transform:translateY(1px); }
  .dp-tag{
    position:relative; z-index:1;
    display:inline-block; font-size:15px; font-weight:900; color:#fff;
    background:linear-gradient(180deg, #4fe0ff 0%, #0091ff 55%, #0062c4 100%);
    padding:5px 16px; border-radius:999px; margin-bottom:10px;
    text-shadow:0 1px 2px rgba(0,20,40,0.5);
    box-shadow:0 3px 12px rgba(0,150,255,0.45), inset 0 1px 0 rgba(255,255,255,0.35);
  }
  .dp-title{
    position:relative; z-index:1;
    font-size:12.5px; font-weight:700; color:var(--text); line-height:1.35;
    margin-bottom:14px; min-height:34px;
  }
  .dp-start{
    position:relative; z-index:1;
    font-size:12.5px; font-weight:800; color:var(--accent);
  }

  .toast{
    position:fixed; left:50%; bottom:70px; transform:translateX(-50%) translateY(20px);
    background:linear-gradient(180deg, #4fe0ff, #0091ff); color:#fff; font-weight:800; font-size:13px;
    padding:11px 20px; border-radius:20px; opacity:0; pointer-events:none;
    box-shadow:0 6px 20px rgba(0,150,255,0.45), inset 0 1px 0 rgba(255,255,255,0.3);
    transition:opacity 0.25s, transform 0.25s; z-index:50; white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,20,40,0.5);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  footer.savebar{
    position:fixed; bottom:0; left:0; right:0;
    background:linear-gradient(to top, rgba(7,11,18,0.95) 60%, transparent);
    padding:16px 16px 14px 16px; text-align:center; font-size:11.5px;
    color:var(--text-dim); pointer-events:none;
    opacity:0.75; transition:opacity 0.2s; z-index:5;
  }
  footer.savebar span.dot{
    color:var(--accent2); font-weight:900;
  }
</style>
</head>
<body>

<header>
  <div class="headrow">
    <div>
      <h1>APM-HSPC · Mesociclo 2</h1>
      <div class="sub">Il mio <b>allenamento</b></div>
    </div>
  </div>
</header>

<main id="main"></main>

<div class="toast" id="toast"></div>
<footer class="savebar" id="savebar"><span class="dot">●</span> salvato automaticamente</footer>

<script>
window.addEventListener("error", (e) => { console.error("errore catturato:", e.error || e.message); e.preventDefault(); });
window.addEventListener("unhandledrejection", (e) => { console.error("promise non gestita:", e.reason); e.preventDefault(); });

// Storage: uso SOLO localStorage del browser (nessun bridge/messaggistica verso Claude).
// Funziona in modo affidabile quando il file è salvato e aperto direttamente nel browser del telefono.
const storageAPI = {
  async get(key){
    const raw = localStorage.getItem(key);
    if(raw === null) throw new Error("chiave non trovata");
    return { key, value: raw };
  },
  async set(key, value){
    localStorage.setItem(key, value);
    return { key, value };
  }
};

// Ogni esercizio: sets = numero di serie, repMax = rep pre-compilate (il massimale del range target),
// unit = "rip" oppure "sec" per esercizi a tempo.
const DAYS = {
  G1: {
    title: "Upper Strength + Potenza",
    cardio: "15′ tapis roulant in salita (incl. 5–8%, 4–5 km/h) — 65% FC max",
    exercises: [
      { id:"g1e1", name:"Spinte Inclinate Multipower 30°", target:"4×8–10", sets:4, repMax:10, unit:"rip" },
      { id:"g1e2", name:"Croci dal Basso ai Cavi", target:"3×12–15", sets:3, repMax:15, unit:"rip" },
      { id:"g1e3", name:"Lat Machine Unilaterale (presa neutra)", target:"4×10/lato", sets:4, repMax:10, unit:"rip" },
      { id:"g1e4", name:"Arnold Press (manubri)", target:"3×10", sets:3, repMax:10, unit:"rip" },
      { id:"g1e5", name:"Seal Row (manubri, panca piana)", target:"3×10", sets:3, repMax:10, unit:"rip" },
      { id:"g1e6", name:"Pushdown Corda", target:"3×10", sets:3, repMax:10, unit:"rip" },
      { id:"g1e7", name:"Cable Crunch", target:"3×12–15", sets:3, repMax:15, unit:"rip" },
    ]
  },
  G2: {
    title: "Lower Strength + Core",
    cardio: "12′ corda (30″/30″) 1×/sett — in sett. B: 15′ bike",
    exercises: [
      { id:"g2e1", name:"Leg Press", target:"4×10", sets:4, repMax:10, unit:"rip" },
      { id:"g2e2", name:"Hip Thrust Bilanciere", target:"4×10", sets:4, repMax:10, unit:"rip" },
      { id:"g2e3", name:"RDL (manubri)", target:"3×10", sets:3, repMax:10, unit:"rip" },
      { id:"g2e4", name:"Leg Extension", target:"3×12", sets:3, repMax:12, unit:"rip" },
      { id:"g2e5", name:"Leg Curl Sdraiato / Back Ext.", target:"3×12", sets:3, repMax:12, unit:"rip" },
      { id:"g2e6", name:"Cable Hip Abduction", target:"3×15", sets:3, repMax:15, unit:"rip" },
      { id:"g2e7", name:"Farmer's Walk", target:"3×25″", sets:3, repMax:25, unit:"sec" },
    ]
  },
  G3: {
    title: "Upper Volume + Grip Power",
    cardio: "20′ bike a 60% FC max",
    exercises: [
      { id:"g3e1", name:"Chin-up / Lat Machine Inversa", target:"4×10", sets:4, repMax:10, unit:"rip" },
      { id:"g3e2", name:"Pike Push-up (piedi rialzati)", target:"4×8–10", sets:4, repMax:10, unit:"rip" },
      { id:"g3e3", name:"Meadows Row (Landmine)", target:"3×12–15/lato", sets:3, repMax:15, unit:"rip" },
      { id:"g3e4", name:"Pulley Basso (corda, presa neutra)", target:"3×10", sets:3, repMax:10, unit:"rip" },
      { id:"g3e5", name:"Rear Delt Fly ai Cavi", target:"4×15", sets:4, repMax:15, unit:"rip" },
      { id:"g3e6", name:"Curl inclinato manubri (45°)", target:"3×12–15", sets:3, repMax:15, unit:"rip" },
      { id:"g3e7", name:"Russian Twist / Cable Woodchopper", target:"3×15/lato", sets:3, repMax:15, unit:"rip" },
    ]
  },
  G4: {
    title: "Metabolic Conditioning (Density Day)",
    cardio: "15′ camminata a 50% FC max (recupero attivo) — no corda",
    exercises: [
      { id:"g4e1", name:"Hack Squat (macchina)", target:"3×10", sets:3, repMax:10, unit:"rip" },
      { id:"g4e2", name:"Piegamenti piedi rialzati + zavorra", target:"3×10", sets:3, repMax:10, unit:"rip" },
      { id:"g4e3", name:"Chest Supported Row", target:"3×10", sets:3, repMax:10, unit:"rip" },
      { id:"g4e4", name:"Seated Leg Curl", target:"3×12", sets:3, repMax:12, unit:"rip" },
      { id:"g4e5", name:"Curl a martello (manubri)", target:"3×12", sets:3, repMax:12, unit:"rip" },
      { id:"g4e6", name:"Cable Rear Delt Crossover", target:"4×15", sets:4, repMax:15, unit:"rip" },
      { id:"g4e7", name:"Plank Laterale / Cable Side Bend", target:"3×30–45″/lato", sets:3, repMax:45, unit:"sec" },
    ]
  }
};

let currentDay = "HOME";
const dayCache = {}; // dayCache[day] = { [exId]: { [setIdx]: {kg, reps} } } — caricato/salvato come UN solo blob per giorno
const saveTimers = {};
const HISTORY_KEY = "apm-hspc-m2:history";

const mainEl = document.getElementById("main");
const savebarEl = document.getElementById("savebar");
const toastEl = document.getElementById("toast");



function renderCurrent(){
  document.body.classList.toggle("screen-minimal", currentDay === "HOME" || currentDay === "PICKER");
  if(currentDay === "HOME") return renderHome();
  if(currentDay === "PICKER") return renderPicker();
  if(currentDay === "STATS") return renderAnalysis();
  if(currentDay === "BODY") return renderBody();
  return renderDay();
}

function liveKey(day){
  return `apm-hspc-m2:live:${day}`;
}

// Carica UNA sola volta per giorno (un'unica chiave in storage con tutti i valori dentro),
// invece di una chiamata per ogni singolo campo — evita il rate limit sui messaggi.
async function getDayState(day){
  if(dayCache[day]) return dayCache[day];
  let state = {};
  try{
    const r = await storageAPI.get(liveKey(day), false);
    if(r && r.value) state = JSON.parse(r.value);
  }catch(e){ /* nessun dato salvato ancora per questo giorno */ }
  dayCache[day] = state;
  return state;
}

function getFieldValue(day, exId, setIdx, field, fallback){
  const st = dayCache[day];
  const v = st && st[exId] && st[exId][setIdx] && st[exId][setIdx][field];
  return (v !== undefined && v !== "") ? v : fallback;
}

function setFieldValue(day, exId, setIdx, field, val){
  dayCache[day] = dayCache[day] || {};
  dayCache[day][exId] = dayCache[day][exId] || {};
  dayCache[day][exId][setIdx] = dayCache[day][exId][setIdx] || {};
  dayCache[day][exId][setIdx][field] = val;
  scheduleSave(day);
}

// Debounce: aspetta che l'utente smetta di scrivere per ~600ms prima di salvare,
// e comunque un'unica chiamata per l'intero giorno (non una per campo).
function scheduleSave(day){
  clearTimeout(saveTimers[day]);
  saveTimers[day] = setTimeout(() => flushSave(day), 600);
}

async function flushSave(day){
  try{
    await storageAPI.set(liveKey(day), JSON.stringify(dayCache[day] || {}), false);
    flashSaved();
  }catch(e){
    console.error("storage error", e);
  }
}

let saveTimeout = null;
function flashSaved(){
  savebarEl.style.opacity = "1";
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(()=>{ savebarEl.style.opacity = "0.55"; }, 900);
}

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(()=> toastEl.classList.remove("show"), 2200);
}

let historyCache = null;

async function loadHistory(){
  if(historyCache) return historyCache;
  let history = [];
  try{
    const r = await storageAPI.get(HISTORY_KEY, false);
    if(r && r.value){
      const parsed = JSON.parse(r.value);
      if(Array.isArray(parsed)) history = parsed;
    }
  }catch(e){ /* nessuno storico ancora */ }
  historyCache = history;
  return historyCache;
}

async function saveHistory(records){
  try{
    await storageAPI.set(HISTORY_KEY, JSON.stringify(records), false);
    historyCache = records;
    return true;
  }catch(e){
    console.error("storage error (history)", e);
    return false;
  }

    const isoDate = now.toISOString().slice(0,10);

      for(let s = 1; s <= ex.sets; s++){

}

function computeFrequency(history){
  const dates = [...new Set(history.map(r => r.date))]; // date uniche (una per sessione salvata)
  const now = new Date();

  const dow = now.getDay(); // 0 = domenica
  const diffToMonday = (dow === 0 ? -6 : 1 - dow);
  const monday = new Date(now);
  monday.setDate(now.getDate() + diffToMonday);
  const mondayIso = monday.toISOString().slice(0,10);
  const monthIso = now.toISOString().slice(0,7);

  const weekCount = dates.filter(d => d >= mondayIso).length;
  const monthCount = dates.filter(d => d.slice(0,7) === monthIso).length;
  return { weekCount, monthCount };
}

// Per ogni sessione salvata (stessa data) dell'esercizio scelto, prende il peso massimo
// tra tutte le serie di quella sessione: è l'indicatore più diretto di progresso.
function buildProgressPoints(history, dayKey, exName){
  const bySession = {};
  for(const r of history){
    if(r.day !== dayKey || r.exercise !== exName) continue;
    const kg = parseFloat(String(r.kg).replace(",", "."));
    if(isNaN(kg)) continue;
    const key = r.date;
    if(!bySession[key] || kg > bySession[key].value){
      bySession[key] = { date: r.date, dateDisplay: r.dateDisplay, value: kg };
    }
  }
  return Object.values(bySession).sort((a,b) => a.date.localeCompare(b.date));
}

function renderLineChart(points){
  const padL = 34, padR = 14, padT = 18, padB = 26;
  const pointGap = 64;
  const w = Math.max(280, padL + padR + (points.length - 1) * pointGap + 20);
  const h = 160;
  const vals = points.map(p => p.value);
  let min = Math.min(...vals), max = Math.max(...vals);
  if(min === max){ min -= 1; max += 1; }
  const range = max - min;
  const yFor = v => padT + (1 - (v - min) / range) * (h - padT - padB);
  const xFor = i => padL + i * pointGap;

  let path = "";
  points.forEach((p, i) => {
    const x = xFor(i), y = yFor(p.value);
    path += (i === 0 ? "M" : "L") + x + "," + y + " ";
  });
  const areaPath = path + `L${xFor(points.length-1)},${h - padB} L${xFor(0)},${h - padB} Z`;

  let dots = "";
  points.forEach((p, i) => {
    const x = xFor(i), y = yFor(p.value);
    dots += `
      <circle cx="${x}" cy="${y}" r="6" fill="url(#dotGrad)" stroke="#0a0f18" stroke-width="2"/>
      <text x="${x}" y="${y - 12}" text-anchor="middle" fill="#eaf5ff" font-size="11" font-weight="800">${p.value}</text>
      <text x="${x}" y="${h - 8}" text-anchor="middle" fill="#7f96ac" font-size="9">${p.dateDisplay.slice(0,5)}</text>
    `;
  });

  return `
    <div style="overflow-x:auto; -webkit-overflow-scrolling:touch;">
      <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;">
        <defs>
          <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#00c8ff" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#00c8ff" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#00e6b8"/>
            <stop offset="100%" stop-color="#00c8ff"/>
          </linearGradient>
          <radialGradient id="dotGrad" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#bdf6ff"/>
            <stop offset="100%" stop-color="#00a0e8"/>
          </radialGradient>
        </defs>
        <line x1="${padL}" y1="${h - padB}" x2="${w - padR}" y2="${h - padB}" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <path d="${areaPath}" fill="url(#areaGrad)" stroke="none"/>
        <path d="${path}" fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        ${dots}
      </svg>
    </div>
  `;
}

      </div>
    `;
    chartHolder.innerHTML += renderLineChart(points);
  }

  select.addEventListener("change", draw);
  draw();
}

async function loadProfile(){

  let p = { nome:"", cognome:"", nascita:"" };
  try{
    const r = await storageAPI.get(PROFILE_KEY);
    if(r && r.value) p = { ...p, ...JSON.parse(r.value) };

  profileCache = p;
  return profileCache;

}

    if(r && r.value){

    }

  bodyHistoryCache = h;
  return bodyHistoryCache;
}

function calcAge(isoDateStr){
  if(!isoDateStr) return null;
  const dob = new Date(isoDateStr);
  if(isNaN(dob.getTime())) return null;
  const today = new Date();
  let age = today.getFullYear() - dob.getFullYear();
  const m = today.getMonth() - dob.getMonth();
  if(m < 0 || (m === 0 && today.getDate() < dob.getDate())) age--;
  return age >= 0 ? age : null;
}

async function saveBodyMeasurement(){
  try{
    const now = new Date();
    const dateStr = now.toLocaleDateString("it-IT");
    const isoDate = now.toISOString().slice(0,10);
    const live = await loadBodyLive();

    const record = { date: isoDate, dateDisplay: dateStr };
    for(const f of BODY_FIELDS) record[f.id] = live[f.id] || "";

    const history = await loadBodyHistory();
    bodyHistoryCache = history.concat([record]);
    await storageAPI.set(BODY_HISTORY_KEY, JSON.stringify(bodyHistoryCache));

    showToast(`✓ Misurazione salvata — ${dateStr}`);
  }catch(e){
    console.error("save body error", e);
    showToast("Salvataggio non riuscito, riprova");
  }
}

// Ultimo valore registrato per data (se salvi più volte lo stesso giorno, vince l'ultimo).
function buildBodyProgressPoints(history, fieldId){
  const byDate = {};
  for(const r of history){

    if(isNaN(v)) continue;
    byDate[r.date] = { date: r.date, dateDisplay: r.dateDisplay, value: v };
  }
  return Object.values(byDate).sort((a,b) => a.date.localeCompare(b.date));
}

      <div class="stat-row">
        <div class="stat-box"><div class="stat-num">${points.length}</div><div class="stat-lbl">Misurazioni</div></div>
        <div class="stat-box"><div class="stat-num">${first.value}→${last.value}</div><div class="stat-lbl">${field.unit} (primo→ultimo)</div></div>
        <div class="stat-box"><div class="stat-num" style="color:${delta >= 0 ? '#00e6b8' : '#00c8ff'}">${sign}${delta}</div><div class="stat-lbl">Variazione ${field.unit}</div></div>
      </div>
    `;
    bodyChartHolder.innerHTML += renderLineChart(points);
  }

  metricSelect.addEventListener("change", drawBodyChart);
  await drawBodyChart();
}

renderCurrent();
</script>

</body>
</html>
